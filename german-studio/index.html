<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استودیو آلمانی لی‌لی</title>
<meta name="description" content="مسیر شخصی آموزش آلمانی از صفر تا C1 با حساب مستقل، تمرین روزانه، تلفظ، گرامر، نوشتن، هایلایت و مرور فاصله‌دار.">
<meta name="theme-color" content="#171717" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1519" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lili Deutsch">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e8eeed; --ink:#15232b; --muted:#5d6d74;
  --brand:#1d4e6b; --brand-ink:#ffffff; --accent:#d9822b; --accent-soft:#fbead6;
  --good:#2f7d4f; --good-bg:#dcefe3; --bad:#b43c3c; --bad-bg:#f7e0de;
  --border:rgba(21,35,43,0.14); --shadow:rgba(21,35,43,0.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1519; --surface:#172026; --surface-2:#1f2b32; --ink:#e7eef0; --muted:#98a9b0;
    --brand:#6fb3d9; --brand-ink:#0b1418; --accent:#f0a24f; --accent-soft:#3a2a17;
    --good:#72c291; --good-bg:#183325; --bad:#ef8a84; --bad-bg:#3a1c1a;
    --border:rgba(255,255,255,0.13); --shadow:rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1519; --surface:#172026; --surface-2:#1f2b32; --ink:#e7eef0; --muted:#98a9b0;
  --brand:#6fb3d9; --brand-ink:#0b1418; --accent:#f0a24f; --accent-soft:#3a2a17;
  --good:#72c291; --good-bg:#183325; --bad:#ef8a84; --bad-bg:#3a1c1a;
  --border:rgba(255,255,255,0.13); --shadow:rgba(0,0,0,0.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink); direction:rtl;
  font-family:'Vazirmatn',Tahoma,sans-serif; line-height:1.75; font-size:16px;
  padding:env(safe-area-inset-top,0) clamp(12px,2vw,32px) calc(84px + env(safe-area-inset-bottom,0));
  -webkit-text-size-adjust:100%;
}
.en{direction:ltr; unicode-bidi:isolate; text-align:left; font-family:'Inter',system-ui,sans-serif}
h1,h2,h3{line-height:1.4; margin:0 0 8px}
h1{font-size:1.35rem} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0 0 10px}
a{color:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
.muted{color:var(--muted); font-size:.9rem}
.shell{width:100%; max-width:none; margin:0}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 0 10px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit}
.brand-mark{width:40px; height:40px; border-radius:10px; object-fit:cover; box-shadow:0 1px 5px var(--shadow)}
.brand small{display:block; color:var(--muted); font-size:.78rem; line-height:1.2}
.top-actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.icon-btn{border:1px solid var(--border); background:var(--surface); border-radius:10px; padding:6px 10px; font-size:.85rem; cursor:pointer; text-decoration:none; color:inherit}

.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin:0 0 12px; box-shadow:0 1px 6px var(--shadow)}
.card.soft{background:var(--surface-2); box-shadow:none}
.card.accent{border-color:var(--accent); background:var(--accent-soft)}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:420px){ .grid2{grid-template-columns:1fr} }

.btn{border:0; border-radius:12px; padding:10px 16px; background:var(--brand); color:var(--brand-ink); font-weight:600; cursor:pointer; min-height:44px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.btn.ghost{background:transparent; color:var(--brand); border:1px solid var(--brand)}
.btn.sub{background:var(--surface-2); color:var(--ink)}
.btn.rec{background:var(--bad); color:#fff}
.btn.small{min-height:36px; padding:6px 12px; font-size:.9rem}
.btn:disabled{opacity:.45; cursor:default}
.btn.block{width:100%}

.tile{display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px}
.tile b{display:block}
.tile span{color:var(--muted); font-size:.85rem}

.task{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border)}
.task:last-child{border-bottom:0}
.task .chk{width:28px; height:28px; border-radius:50%; border:2px solid var(--brand); background:transparent; flex:none; cursor:pointer; display:grid; place-items:center; color:var(--brand-ink); font-size:14px}
.task.done .chk{background:var(--good); border-color:var(--good)}
.task.done .ttl{text-decoration:line-through; color:var(--muted)}
.task a.ttl{flex:1; color:inherit; text-decoration:none}
.task .min{color:var(--muted); font-size:.85rem; white-space:nowrap}

.pill{display:inline-block; padding:2px 10px; border-radius:999px; background:var(--surface-2); font-size:.8rem; color:var(--muted)}
.pill.on{background:var(--accent); color:#1b1206}
.switch{display:flex; align-items:center; gap:10px; cursor:pointer}

.prompt{font-size:1.08rem; line-height:1.6}
.prompt ul{margin:8px 0 0; padding-left:20px}
.qline{display:flex; gap:8px; align-items:flex-start; padding:6px 0}
.say{border:1px solid var(--border); background:var(--surface-2); border-radius:8px; padding:2px 8px; cursor:pointer; flex:none; font-size:.85rem}

.timer{font-family:'Inter'; font-size:2.2rem; font-weight:700; text-align:center; letter-spacing:1px; direction:ltr}
.timer.warn{color:var(--accent)} .timer.over{color:var(--bad)}
.recdot{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--bad); animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}

.opt{display:block; width:100%; text-align:left; direction:ltr; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:10px 14px; margin:6px 0; cursor:pointer; font-family:'Inter'}
.opt.right{background:var(--good-bg); border-color:var(--good)}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad)}
.opt.sel{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
.explain{background:var(--surface-2); border-radius:12px; padding:10px 12px; margin-top:8px}

.flash{text-align:center; padding:24px 12px}
.flash .front{font-size:1.15rem}
.flash .ans{font-size:1.25rem; font-weight:700; color:var(--brand); margin-top:10px}
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}

.sent{padding:12px 0; border-bottom:1px solid var(--border)}
.sent:last-child{border:0}
.mark{font-family:'Inter'; color:var(--muted); font-size:.92rem; margin-top:4px}
.pairbtns{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.pairbtns .btn{font-family:'Inter'; font-size:1.2rem}

textarea{width:100%; min-height:260px; border:1px solid var(--border); border-radius:12px; padding:12px; background:var(--surface); direction:ltr; text-align:left; font-family:'Inter'; line-height:1.6; font-size:16px}
textarea.short{min-height:90px}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=date],select{border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--surface); min-height:40px; font-size:16px}
label.chkrow{display:flex; gap:10px; align-items:flex-start; padding:6px 0}
label.chkrow input{margin-top:6px; width:18px; height:18px}

.bars{display:flex; align-items:flex-end; gap:6px; height:120px; padding-top:8px; direction:ltr}
.bars .b{flex:1; background:var(--brand); border-radius:6px 6px 0 0; min-height:2px; position:relative}
.bars .b span{position:absolute; top:-20px; left:0; right:0; text-align:center; font-size:.7rem; color:var(--muted)}
.barlabels{display:flex; gap:6px; direction:ltr} .barlabels span{flex:1; text-align:center; font-size:.7rem; color:var(--muted)}
.meter{height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden}
.meter i{display:block; height:100%; background:var(--brand)}
.stat{font-family:'Inter'; font-size:1.6rem; font-weight:700}

.nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0)); z-index:10}
.nav a{flex:1; text-align:center; text-decoration:none; color:var(--muted); font-size:.78rem; padding:4px 0; border-radius:10px}
.nav a b{display:block; font-size:1.15rem; font-family:'Inter'; line-height:1.3}
.nav a.on{color:var(--brand); background:var(--surface-2)}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom,0)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:.9rem; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw}
.toast.show{opacity:1}
.highlight-fab{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(94px + env(safe-area-inset-bottom,0)); z-index:18; display:none; box-shadow:0 5px 20px var(--shadow)}
.highlight-fab.show{display:inline-flex}
mark.user-highlight{background:#ffe66d; color:#172026; border-radius:3px; padding:0 2px}
.highlight-quote{border-right:4px solid #f0bd24; padding-right:12px; direction:auto}
audio{width:100%; margin-top:8px}
details summary{cursor:pointer; font-weight:600}
.back{display:inline-block; margin-bottom:10px; text-decoration:none; font-size:.9rem}
pre.copybox{white-space:pre-wrap; direction:ltr; text-align:left; font-family:'Inter'; font-size:.85rem; background:var(--surface-2); padding:10px; border-radius:10px; max-height:180px; overflow:auto}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#today"><img class="brand-mark" src="icons/favicon-64.png" width="40" height="40" alt="نشان لی‌لی"><span><b>استودیو آلمانی لی‌لی</b><small id="daybadge"></small></span></a>
    <div class="top-actions">
      <a class="icon-btn" href="#path">مسیر یادگیری</a>
      <a class="icon-btn" href="#highlights">هایلایت‌ها</a>
      <a class="icon-btn" href="#progress">پیشرفت</a>
      <a class="icon-btn" href="#settings">تنظیمات</a>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" id="nav">
  <a href="#today" data-r="today"><b>●</b>امروز</a>
  <a href="#speak" data-r="speak"><b>🎙</b>گفتار</a>
  <a href="#pron" data-r="pron"><b>ə</b>تلفظ</a>
  <a href="#practice" data-r="practice"><b>✓</b>تمرین</a>
  <a href="#write" data-r="write"><b>✎</b>نوشتار</a>
</nav>
<div class="toast" id="toast"></div>
<button class="btn highlight-fab" id="highlightBtn" data-act="addHighlight">ذخیره هایلایت</button>
<script src="data.js"></script>
<script src="curriculum.js"></script>
<script src="learning-engine.js"></script>
<script src="beginner-content.js"></script>
<script src="supabase-config.js"></script>
<script src="sync-client.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
}
</script>
</body>
</html>
